name: Publish to Chrome Web Store

on:
  push:
    branches: [main]
    # Only runtime files ship in the zip; docs, tests and tooling changes
    # don't publish.
    paths:
      - "extension/manifest.json"
      - "extension/src/**"
      - "extension/icons/*.png"
  workflow_dispatch:

permissions: {}

concurrency:
  group: cws-publish
  cancel-in-progress: false

jobs:
  # Bumps the patch version, commits it to main, and tags it. Pushes made
  # with GITHUB_TOKEN don't trigger workflows, so this commit doesn't loop.
  bump:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.bump.outputs.version }}
      sha: ${{ steps.bump.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: true # zizmor: ignore[artipacked] this job pushes the bump commit

      - name: Bump, commit, and push
        id: bump
        run: |
          current=$(jq -r .version extension/manifest.json)
          IFS=. read -r major minor patch <<< "$current"
          version="${major}.${minor}.$((patch + 1))"
          for f in extension/manifest.json extension/package.json; do
            tmp=$(mktemp)
            jq --arg v "$version" '.version = $v' "$f" > "$tmp" && mv "$tmp" "$f"
          done
          (cd extension && npm version "$version" --no-git-tag-version --allow-same-version >/dev/null)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add extension/manifest.json extension/package.json extension/package-lock.json
          git commit -m "Release v${version}"
          git tag "v${version}"
          # Someone may have pushed while this ran; replay on top and retry once.
          if ! git push --atomic origin HEAD:main "v${version}"; then
            git pull --rebase origin main
            git tag -f "v${version}"
            git push --atomic origin HEAD:main "v${version}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Released $current -> $version"

  publish:
    needs: bump
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.bump.outputs.sha }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Test and package
        working-directory: extension
        run: |
          npm ci
          ./release.sh

      - name: Upload and submit for review
        working-directory: extension
        env:
          VERSION: ${{ needs.bump.outputs.version }}
          EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: npx --no-install chrome-webstore-upload --source "dist/keyline-${VERSION}.zip"
