name: Publish to Chrome Web Store

on:
  push:
    branches: [main]
    # Only runtime files ship in the zip; docs, tests and tooling changes
    # don't publish.
    paths:
      - "extension/manifest.json"
      - "extension/src/**"
      - "extension/icons/*.png"
  workflow_dispatch:

permissions: {}

concurrency:
  group: cws-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The version is stamped here, never by hand: MAJOR.MINOR come from
      # manifest.json and PATCH is the number of commits on main. That count
      # only grows (main is never force-pushed), so every publish is higher
      # than the last, which the store requires. The stamp is not committed
      # back, so this job needs no write access.
      - name: Stamp the version
        id: version
        run: |
          base=$(jq -r .version extension/manifest.json)
          major_minor=$(echo "$base" | cut -d. -f1,2)
          patch=$(git rev-list --count HEAD)
          version="${major_minor}.${patch}"
          tmp=$(mktemp)
          jq --arg v "$version" '.version = $v' extension/manifest.json > "$tmp" && mv "$tmp" extension/manifest.json
          tmp=$(mktemp)
          jq --arg v "$version" '.version = $v' extension/package.json > "$tmp" && mv "$tmp" extension/package.json
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Publishing $version (manifest base $base)"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Test and package
        working-directory: extension
        run: |
          npm ci
          ./release.sh

      - name: Upload and submit for review
        working-directory: extension
        env:
          VERSION: ${{ steps.version.outputs.version }}
          EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: npx --no-install chrome-webstore-upload --source "dist/keyline-${VERSION}.zip"
